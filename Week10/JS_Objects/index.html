<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JS Objects Lesson</title>
  </head>
  <body>
    <h1>Open the Console to see your output!</h1>

    <script>
      // Your JavaScript goes here


//SECTION 1
    // object = collection of key-value pairs
    // property = a key value pair
    // key name
    // value "Alex"



//SECTION 2
      const person = {
        name: "Alex",
        age: 22,
        isStudent: true
      };

      console.log(person);



    //SECTION 3
      // how to call: object.property or object["property"]
      console.log(person.name);
      console.log(person["name"]);

      // in bracket case, can use variable as input
      let myKey = "name";
      console.log(person[myKey]);

      // person.name (dot notation) is simpler and easier to read
      // person("name") is better for when key is dynamic and/or in variable

      const movie = {
        title: "Inception",
        year: 2010,
        director: "Christopher Nolan",
      };

      console.log(movie.title);
      console.log(movie["director"]);

      let myVar = "year";
      console.log(movie[myVar]);
      


    //SECTION 4

    //can add onto object after creating and establishing it
    person.city = "New York";
    console.log(person.city);

    //can delete
    delete person.isStudent;
    console.log(person);



    const car = {
        make: "Toyota",
        model: "Camry",
        year: 2020,
    }

    car.year = 2024;
    car.color = "blue";
    delete car.model;
    console.log(car);



    //SECTION 5
    
    //method = function stored as a property inside an object

    const calculator = {
        add: function(a,b){
            return a+b;
        },
        subtract: function(a,b){
            return a-b;
        },
    };

    console.log(calculator.add(5,3));
    console.log(calculator,subrtract(10,4));

    //alternative shorthand:
    const calculator2 = {
        add(a,b){
            return a+b;
        },
        subtract(a,b){
            return a-b;
        },
    };


    //"this" refers to looking at a property within the same object
    const person = {
        name: "Alex",

        greet(){
            console.log ("Hi, I'm " + this.name);
        },
    };
    // in this case, "this.name" is person.name bc it is called within the person object



    const dog = {
        name: "Biscuit",
        breed: "Beagle",
        bark() {
            console.log(this.name + " says: Woof!");
        },
    };
    
    dog.bark();
    
    dog.describe = function(){
        console.log(this.name + " is a " + this.breed);
    };

    dog.describe();


    //SECTION 6

    //Object Methods = built in things you can do with objects

    const person = {
        name: "Alex",
        age: 22,
        city: "New York",
    }

    //Object.keys(objectname) returns all the keys in the object
    console.log(Object.keys(person));

    //Object.values(objectname) returns all the values (properties)
    console.log(Object.values(person));

    //Object.entries(objectname) returns all the key:value pairs in the obj
    console.log(Object.entries(person));

    const laptop = {
        brand: "Apple",
        model: "MacBook Pro",
        ram: 16,
        storage: 512,
    };

    console.log(Object.keys(laptop));
    console.log(Object.values(laptop));
    console.log(Object.entries(laptop));



    //SECTION 7

    //book object

    // Step 1: Create an object called `book` with these properties:
//   - title        (string  — pick any book you like)
//   - author       (string)
//   - pages        (number)
//   - isAvailable  (boolean — set to true)


    const book = {
        title: "On Earth We're Briefly Gorgeous",
        author: "Ocean Vuong",
        pages: 246,
        isAvailable: true,
    }

// Step 2: Log the title using dot notation.

    console.log(book.title);

// Step 3: Log the author using bracket notation.

    console.log(book["title"])

// Step 4: Add a new property called `genre` (any genre you like).

    book.genre = "fiction";

// Step 5: Update isAvailable to false.

    book.isAvailable = "false";

// Step 6: Add a method called `describe` that logs:
//   "Title by Author — X pages"
//   Use this.title, this.author, and this.pages

    book.describe = function(){
        console.log(
         this.title
         + " by "
         + this.author 
         + " - " 
         + this.pages
         + " pages"
        );
    };

    // Step 7: Call book.describe()

    book.describe();



// Step 8: Use Object.keys() to log all the property names.

    Object.keys(book);

    </script>
  </body>
</html>

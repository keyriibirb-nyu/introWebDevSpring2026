<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modal Wizard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <h1>Bootstrap modals and util classes</h1>
    <div class="container mt-5">
      <div class="p-3 bg-warning-subtle text-success border border-5 border-danger rounded-5">
        Example element with utility classes applied
      </div>
    </div>

    <div class="container mt-5">
      <button type="button" class="btn btn-lg btn-outline-dark border-2" data-bs-toggle="modal" data-bs-target="#wizard">
        Open Wizard
      </button>
    </div>



<!-- BEGIN MODAL 1 #wizard -->
    <div class="modal fade" id="wizard" aria-hidden="true" aria-labelledby="wizard-label" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="wizard-label">Modal 1</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            Show a second modal and hide this one with the button below.
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary" data-bs-target="#wizard-2" data-bs-toggle="modal">Next</button>
          </div>
        </div>
      </div>
    </div>
<!-- END MODAL 1 #wizard -->


<!-- BEGIN MODAL 2 #wizard-2 -->
    <div class="modal fade" id="wizard-2" aria-hidden="true" aria-labelledby="wizard-2-label" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="wizard-2-label">Modal 2</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            Hide this modal and show the first with the button below.
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary" data-bs-target="#wizard" data-bs-toggle="modal">Previous</button>
          </div>
        </div>
      </div>
    </div>
<!-- END MODAL 2 #wizard-2 -->



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>

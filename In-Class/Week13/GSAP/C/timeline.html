<!doctype html>
<html>
  <head>
    <title>Simple Timeline</title>
    <style type="text/css" media="screen">
      body{
        text-align: center;
      }
      .progress{
        position: relative;
        z-index: 5;
        width: 100%;
        height: 10px;
        background-color: cadetblue;
      }

      h2, p {
        text-shadow: 4px 4px 8px rgba(0,0,0,0.5);
        /* left?, right?, blur, color */
        position: relative; 
      }

    </style>
  </head>

  <body>
    <div class="progress"></div>
    <div id="page-wrap">
      <h2>Hello Green Sock</h2>
      <h2>You're Awesome</h2>
      <p id="description">
        I just made my first timeline and thats pretty cool!
      </p>
    </div>
    <!--
      Older free without subscription versions
      https://github.com/greensock/GSAP
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12/dist/gsap.min.js"></script>
    <!-- Our Script using GSAP Library Functions -->
    <script type="text/javascript">
      document.addEventListener('DOMContentLoaded', ()=>{
        const headers = document.getElementsByTagName('H2'); // a node list of our headers
        const hello = headers[0];
        const awesome = headers[1];
        const text = document.getElementById('description');
        const progress = document.getElementsByClassName('progress')[0]
        const bg = document.querySelector('#page-wrap')


        // make a timeline to store our animations
        const tl = new TimelineLite()

        //now we add our different animations to timeline and it automatically puts one after thje other
        tl.from(bg, 0.5, {
          opacity: 0,
        })
        .from(hello, 0.5, {
          left: -500,
          // words like left or right only work when the obj is positioned relative
          opacity: 0,
        })
        .from(awesome, 0.5, {
          right: -1000,
          opacity: 0,
        })
        .from(text, 1, {
          bottom: -1000,
          opacity: 0,
        })
        .from(progress, tl.duration(), { //have progress bar follow tl as it plays out
          scaleX: 0,
          transformOrigin: 'left',//default transformOrigin is center center
          ease: Linear.easeNone,
        }, 0)//start at time = 0
        .to(progress, 0.2, {  //then make the bar disappear
          opacity:0,
          top:-10,
        })
      })
    </script>
  </body>
</html>

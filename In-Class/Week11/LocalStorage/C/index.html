<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local Storage
    </title>

    <!-- using bootstrap's atomic css styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>

  <div class="container mt-5">
      <!-- span will change when local storage is accessed -->
      <h1>Hello, <span id="user">world</span>!</h1>


    <form id="userInfo" class="shadow-sm p-3 mb-5 bg-body-tertiary rounded">

      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="firstName" placeholder="Your First Name Here">
        <label for="firstName">Enter your first name here</label>
      </div>

      <button id="nameSetBtn" type="button" class="btn btn-info btn-lg">Submit</button>
    </form>

    <button id="clearNameBtn" type="button" class="btn btn-danger btn-lg">Clear Local Storage</button>

  </div>




    <script>
      //sets user name based on form input
      const saveUser = () => {
        // grab input element you want to read from, access .value
        const name = document.getElementById('firstName').value;
        // write to local storage
        localStorage.firstName = name;
        window.location.reload();
      }



      const clearLocalStorage = () => {
        localStorage.clear() // clears all local storage for this webpage
        //refresh the page
        window.location.reload();
        
      }

      document.addEventListener("DOMContentLoaded", ()=>{
        document.getElementById('nameSetBtn')
        //event listener uses function(){} rather than ()=>{}
        .addEventListener('click', function() {
          saveUser();
        })


        document.getElementById('clearNameBtn').addEventListener('click', clearLocalStorage);


        //conditional to check if local storage key exists
        // this only runs once during the page finishing loading
        if (localStorage.firstName){
          //set value of span in h1 to the value of firstName
          document.getElementById('user').innerHTML = localStorage.firstName;
        }
       

      })


       


      //when written in local storage, it will look like:
      /* {
       "firstName": userName
       } */
    </script>

    



  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tip Calculator</title>
    <style type="text/css">
      .container {
        width: 300px;
        margin: 0 auto;
        /* trick from before flexbox align items center */
        line-height: 40px;
        margin-top: 5%;
        border: 1px solid gray;
        border-radius: 10px;
        padding: 20px;
      }

      .well {
        border-radius: 10px;
        background-color: #ddd;
        min-height: 100px;
        padding: 20px;
      }

      .container button {
        width: 100%;
        padding: 10px 0;
        border: 2px solid gray;
        cursor: pointer;
        margin: 10px 0;
        color: white;
        background-color: #333;
        transition: background-color 1s ease;
      }

      .container button:hover {
        background-color: #777;
      }

      input[type='number'] {
        width: 100%;
        padding: 10px 0;
        border: 1px solid gray;
        border-radius: 5px;
        text-align: center;
        font-size: 24px;
      }
    </style>
  </head>



  <body>

    <div class="container">
      <h1>Tip Calculator</h1>
      <form>
        <label for="bill">What is the total bill?</label>
        <input type="number" name="bill" id="bill" min="0" step="0.01" required/>

        <br/>

        <!-- radio group: all share same name, all have different values -->
        <!-- common design pattern to wrap label around each radio input bc attributes are all the same -->
        <label><input type="radio" name="tip" value="0.05"/>5%</label>
        <label><input type="radio" name="tip" value="0.10"/>10%</label>
        <label><input type="radio" name="tip" value="0.15"/>15%</label>
        <label><input type="radio" name="tip" value="0.20"/>20%</label>

        <br/>

        <!-- browser default: button type="submit" will submit the form, refresh the page and add input to url -->
        <button type="submit" id="calcBtn">Calculate Tip</button>
      </form>

      <div class="well" id="tipResult"></div>
    </div>


    <script type="text/javascript">
      document.addEventListener('DOMContentLoaded', function(){


        // assign HTML elements to variables
        // where event listeners are added
        document.getElementById('calcBtn').addEventListener('click', calcTip)
      })

      const calcTip = (event) => {
        // stop page from refreshing
        // stop form fields from clearing
        // stop url from getting query string
        event.preventDefault();
        //console.log(event.target);


        //grab output div, store as scoped var
        let result = document.getElementById('tipResult');

        //grab value of user bill input
        let bill = document.getElementById('bill').value;
        bill = parseFloat(bill);

        //declare more scoped vars for calculation
        let per; //from user selection radio group
        let tip; //bill * per
        let total; //bill + tip


        //find selected tip percentage from radio buttons
        let arrTips = document.getElementsByName('tip');
        //looks like an array, but is a NodeList
        //console.log(arrTips);
        
        //loop through all inputs, find one with checked=true;
        //per = tip decimal
        for(let i = 0; i < arrTips.length; i++){
          if (arrTips[i].checked){
            per = arrTips[i].value;
            //once we find checked one, can exit loop
            break
          }
        }

        //calculate tip from per
        tip = bill * per;

        //results in longer decimals, use funct to round to cents
        tip = moneyRound(tip);

        //calculate total
        total = bill + tip;
        total = moneyRound(total);

        //add HTML elements into the document
        let p1 = document.createElement('P');
        let p2 = document.createElement('P');
        let p3 = document.createElement('P');
        let p4 = document.createElement('P');

        let t1 = document.createTextNode(`Bill is $${bill}.`)
        let t2 = document.createTextNode(`Tip percentage is ${per * 100}%.`)
        let t3 = document.createTextNode(`Calculated tip: $${tip}.`)
        let t4 = document.createTextNode(`Total: $${total}.`)

        p1.appendChild(t1);
        p2.appendChild(t2);
        p3.appendChild(t3);
        p4.appendChild(t4);

        result.appendChild(p1)
        result.appendChild(p2)
        result.appendChild(p3)
        result.appendChild(p4)
      }

      const moneyRound = (num) => {
        return ((Math.ceil(num * 100)) / 100);
      }

    </script>
  </body>




</html>
